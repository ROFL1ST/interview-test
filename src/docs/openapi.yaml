openapi: 3.0.3
info:
  title: Authentication API
  description: REST API Authentication Service (Register, Login, User Profile)
  version: 1.0.0
servers:
  - url: http://localhost:3000

paths:
  /api/v1/health:
    get:
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          description: OK
          content:
            application/json:
              example:
                success: true
                message: OK
                data:
                  status: healthy
                  timestamp: "2026-11-01T12:00:00.000Z"
                  database: connected

  /api/v1/auth/register:
    post:
      summary: Register account
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - gender
              properties:
                name:
                  type: string
                  example: Budi Pratama
                email:
                  type: string
                  format: email
                  example: budi.pratama@example.com
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: secret123
                gender:
                  type: string
                  enum: [male, female, laki-laki, perempuan]
                  example: laki-laki
      responses:
        '201':
          description: User created
          content:
            application/json:
              example:
                success: true
                message: Registrasi berhasil. Akun Anda telah dibuat
                data:
                  id: 1
                  name: Budi Pratama
                  email: budi.pratama@example.com
                  gender: laki-laki
                  created_at: "2026-11-01T12:00:00.000Z"
                  updated_at: "2026-11-01T12:00:00.000Z"
        '400':
          description: Validation error
        '409':
          description: Email already registered

  /api/v1/auth/login:
    post:
      summary: Login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: budi.pratama@example.com
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        '200':
          description: Login success
          content:
            application/json:
              example:
                success: true
                message: Login berhasil
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    id: 1
                    name: Budi Pratama
                    email: budi.pratama@example.com
                    gender: laki-laki
        '401':
          description: Invalid credentials

  /api/v1/users/profile:
    get:
      summary: Get user profile
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                success: true
                message: Data profile user berhasil diambil
                data:
                  id: 1
                  name: Budi Pratama
                  email: budi.pratama@example.com
                  gender: laki-laki
                  created_at: "2026-11-01T12:00:00.000Z"
                  updated_at: "2026-11-01T12:00:00.000Z"
        '401':
          description: Unauthorized

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
